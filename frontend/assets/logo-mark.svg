<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="VeriModel">
  <!-- VeriModel mark: a chamfered steel plate, a V whose right stroke becomes the check. -->
  <defs>
    <linearGradient id="vm-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <path d="M10 2h44l8 8v44l-8 8H10l-8-8V10z" fill="url(#vm-plate)"/>
  <path d="M10 2h44l8 8v44l-8 8H10l-8-8V10z" fill="none" stroke="#374151" stroke-width="1.5"/>
  <!-- rivets -->
  <circle cx="9" cy="9" r="1.6" fill="#4b5563"/><circle cx="55" cy="9" r="1.6" fill="#4b5563"/>
  <circle cx="9" cy="55" r="1.6" fill="#4b5563"/><circle cx="55" cy="55" r="1.6" fill="#4b5563"/>
  <!-- V -->
  <path d="M14 17l12 30" fill="none" stroke="#e5e7eb" stroke-width="7" stroke-linecap="round"/>
  <!-- check: the V's right stroke rises into the tick -->
  <path d="M26 47l24-28" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
</svg>
