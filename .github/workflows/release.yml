name: Release

# Builds installers for Windows, macOS and Linux when a version tag is pushed
# (e.g. `git tag v1.0.0 && git push origin v1.0.0`) and attaches them to a
# GitHub Release. The CLI binaries are attached too.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: msi,nsis
            cli: target/release/verimodel.exe
            cli_asset: verimodel-cli-windows-x64.exe
          - name: macos-arm64
            os: macos-latest
            bundles: dmg
            cli: target/release/verimodel
            cli_asset: verimodel-cli-macos-arm64
          - name: linux-x64
            os: ubuntu-24.04
            bundles: appimage,deb
            cli: target/release/verimodel
            cli_asset: verimodel-cli-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build CLI
        run: cargo build --release -p verimodel-cli
      - name: Build desktop installers
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.cli }}" "dist/${{ matrix.cli_asset }}"
          find target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: verimodel-${{ matrix.name }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: VeriModel ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: dist/*
